name: Release

# Draait op een versietag (v1.2.3) en publiceert één GitHub Release met:
#   - codex-web-<versie>.tar.gz   (frontend/dist voor handmatige deploy)
#   - Windows installer (.exe NSIS en .msi) plus .sig en latest.json voor de Tauri-updater
#   - codex-android.apk en codex-android.aab (ondertekend)
# Maak een tag met: npm run release -- 0.3.0 --push

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestaande tag om opnieuw te bouwen (bijvoorbeeld v0.3.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Controleer versie en tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        name: Tag moet gelijk zijn aan package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" != "${TAG}" ]; then
            echo "Tag ${TAG} komt niet overeen met package.json versie $VERSION" >&2
            exit 1
          fi
          node scripts/sync-version.mjs --check
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: backend
      - run: composer test
        working-directory: backend

  web:
    name: Web-bundel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run build
        env:
          CODEX_BUILD: ${{ github.sha }}
      - run: tar -czf codex-web-${{ needs.verify.outputs.version }}.tar.gz -C frontend/dist .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Codex ${{ env.TAG }}
          draft: false
          files: codex-web-${{ needs.verify.outputs.version }}.tar.gz

  windows:
    name: Windows (Tauri)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: API-origin voor de desktop-build
        run: echo "VITE_API_BASE_URL=${{ vars.API_BASE_URL || 'https://codex.nordinkole.nl' }}" >> frontend/.env.tauri.local
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CODEX_BUILD: ${{ github.sha }}
        with:
          # Projectroot: daar staat de Tauri-CLI (root package.json) en vandaar werkt beforeBuildCommand.
          projectPath: .
          tagName: ${{ env.TAG }}
          releaseName: Codex ${{ env.TAG }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    name: Android (Capacitor)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Web-assets voor Capacitor
        run: npm --prefix frontend run build:android
        env:
          CODEX_BUILD: ${{ github.sha }}
      - name: Capacitor sync
        run: npx cap sync android
      - name: Keystore uit secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/codex.keystore
      - name: Ondertekende build
        working-directory: android
        env:
          CODEX_KEYSTORE_FILE: ${{ github.workspace }}/android/codex.keystore
          CODEX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CODEX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CODEX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../codex-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../codex-android.aab
      - name: Keystore opruimen
        if: always()
        run: rm -f android/codex.keystore
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Codex ${{ env.TAG }}
          draft: false
          files: |
            codex-android.apk
            codex-android.aab

  deploy:
    name: Deploy naar VPS
    needs: [verify, web]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
